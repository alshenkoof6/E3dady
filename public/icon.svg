<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#d97706" stroke-width="3" stroke-opacity="0.4" />

  <!-- Radiant Glow Halo Behind Cross -->
  <circle cx="256" cy="240" r="160" fill="url(#haloGrad)" />

  <!-- Radiant Ray Spokes -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <line x1="256" y1="90" x2="256" y2="120" />
    <line x1="256" y1="360" x2="256" y2="390" />
    <line x1="120" y1="240" x2="150" y2="240" />
    <line x1="362" y1="240" x2="392" y2="240" />
    <line x1="160" y1="144" x2="182" y2="166" />
    <line x1="330" y1="314" x2="352" y2="336" />
    <line x1="352" y1="144" x2="330" y2="166" />
    <line x1="182" y1="314" x2="160" y2="336" />
  </g>

  <!-- Coptic Cross Design -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Vertical Arm -->
    <rect x="238" y="110" width="36" height="260" rx="8" />
    <!-- Horizontal Arm -->
    <rect x="146" y="202" width="220" height="36" rx="8" />

    <!-- Center Emblem Disc -->
    <circle cx="256" cy="220" r="32" fill="#7f1d1d" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="256" cy="220" r="14" fill="url(#goldGrad)" />

    <!-- Cross Finials / Trefoil Details (Top, Bottom, Left, Right) -->
    <!-- Top Finial -->
    <circle cx="256" cy="110" r="12" />
    <circle cx="240" cy="104" r="8" />
    <circle cx="272" cy="104" r="8" />

    <!-- Bottom Finial -->
    <circle cx="256" cy="370" r="12" />
    <circle cx="240" cy="376" r="8" />
    <circle cx="272" cy="376" r="8" />

    <!-- Left Finial -->
    <circle cx="146" cy="220" r="12" />
    <circle cx="140" cy="204" r="8" />
    <circle cx="140" cy="236" r="8" />

    <!-- Right Finial -->
    <circle cx="366" cy="220" r="12" />
    <circle cx="372" cy="204" r="8" />
    <circle cx="372" cy="236" r="8" />

    <!-- Corner Radiance Stars -->
    <path d="M 200 164 L 204 172 L 212 176 L 204 180 L 200 188 L 196 180 L 188 176 L 196 172 Z" />
    <path d="M 312 164 L 316 172 L 324 176 L 316 180 L 312 188 L 308 180 L 300 176 L 308 172 Z" />
    <path d="M 200 276 L 204 284 L 212 288 L 204 292 L 200 300 L 196 292 L 188 288 L 196 284 Z" />
    <path d="M 312 276 L 316 284 L 324 288 L 316 292 L 312 300 L 308 292 L 300 288 L 308 284 Z" />
  </g>

  <!-- Title Bottom Ribbon / Badge -->
  <g fill="url(#goldGrad)" text-anchor="middle" font-family="'Cairo', sans-serif">
    <text x="256" y="425" font-size="28" font-weight="900" letter-spacing="1">خدمة إعدادي</text>
    <text x="256" y="456" font-size="16" font-weight="700" fill="#fde68a" opacity="0.9">العذراء مريم بسدود</text>
  </g>
</svg>
